<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>VR Hand Camera</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    touch-action:none;

}


/* =====================================================
   CONTENEDOR VR
===================================================== */

#vr{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    display:flex;

    background:#000;

}


/* =====================================================
   CADA OJO
===================================================== */

.eye{

    position:relative;

    width:50%;
    height:100%;

    overflow:hidden;

    background:#000;

}


/* =====================================================
   VIDEO
===================================================== */

.eye video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

}


/* =====================================================
   CANVAS DE MANOS
===================================================== */

.handCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

}


/* =====================================================
   LÍNEA CENTRAL
===================================================== */

#centerLine{

    position:fixed;

    left:50%;
    top:0;

    width:3px;
    height:100%;

    transform:translateX(-50%);

    background:#000;

    z-index:20;

    pointer-events:none;

}


/* =====================================================
   INFORMACIÓN
===================================================== */

#info{

    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ffff;

    background:rgba(0,0,0,.55);

    border:2px solid rgba(0,255,255,.6);

    border-radius:12px;

    padding:9px 18px;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        0 0 8px #00ffff;

    white-space:nowrap;

    pointer-events:none;

}


/* =====================================================
   ESTADO
===================================================== */

#status{

    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ff88;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        0 0 8px #00ff88;

    white-space:nowrap;

    pointer-events:none;

}


/* =====================================================
   PANTALLA DE INICIO
===================================================== */

#startScreen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    background:
        radial-gradient(
            circle,
            #082020 0%,
            #020707 45%,
            #000 100%
        );

}


#startScreen h1{

    font-size:clamp(
        28px,
        8vw,
        60px
    );

    letter-spacing:5px;

    margin-bottom:20px;

    color:#00ffff;

    text-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;

}


#startScreen p{

    width:85%;

    max-width:650px;

    color:#baffff;

    line-height:1.6;

    margin-bottom:30px;

}


#startButton{

    padding:18px 35px;

    color:#00ffff;

    background:#001818;

    border:2px solid #00ffff;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    box-shadow:
        0 0 12px #00ffff,
        inset 0 0 15px #003333;

}


#startButton:active{

    transform:scale(.94);

}


/* =====================================================
   FPS
===================================================== */

#fps{

    position:fixed;

    top:18px;
    right:15px;

    z-index:50;

    color:#00ff88;

    font-size:12px;

    background:rgba(0,0,0,.5);

    padding:7px 10px;

    border-radius:6px;

    pointer-events:none;

}

</style>

</head>


<body>


<!-- ==================================================
     VISTA VR
================================================== -->

<div id="vr">


    <!-- OJO IZQUIERDO -->

    <div class="eye">

        <video
            id="leftVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="leftHands"
            class="handCanvas">
        </canvas>

    </div>


    <!-- OJO DERECHO -->

    <div class="eye">

        <video
            id="rightVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="rightHands"
            class="handCanvas">
        </canvas>

    </div>


</div>


<div id="centerLine"></div>


<div id="info">
VR CAMERA • 60 FPS
</div>


<div id="fps">
FPS: --
</div>


<div id="status">
CÁMARA DESACTIVADA
</div>


<!-- ==================================================
     INICIO
================================================== -->

<div id="startScreen">

    <h1>VR VISION</h1>

    <p>

        Cámara trasera para VR Box.
        Coloca tus manos delante de la cámara
        y aparecerá un esqueleto digital
        sobre ellas.

    </p>

    <button id="startButton">

        ACTIVAR CÁMARA

    </button>

</div>



<!-- ==================================================
     MEDIAPIPE
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const leftVideo =
    document.getElementById("leftVideo");

const rightVideo =
    document.getElementById("rightVideo");


const leftCanvas =
    document.getElementById("leftHands");

const rightCanvas =
    document.getElementById("rightHands");


const leftCtx =
    leftCanvas.getContext("2d");

const rightCtx =
    rightCanvas.getContext("2d");


const startScreen =
    document.getElementById("startScreen");


const startButton =
    document.getElementById("startButton");


const statusText =
    document.getElementById("status");


const fpsText =
    document.getElementById("fps");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let running = false;

let handsBusy = false;

let detectedHands = [];

let lastDetection = 0;

let frames = 0;

let lastFPS = performance.now();


/*
   La cámara se intenta utilizar a 60 FPS.

   La detección de manos se hace a 20 FPS
   para no bloquear el vídeo.
*/

const HAND_INTERVAL = 50;


/* =====================================================
   CONEXIONES DE LA MANO
===================================================== */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands = new Hands({

    /*
       IMPORTANTE:
       debe estar TODO en el mismo return.
    */

    locateFile: function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    /*
       1 = dos manos
    */

    maxNumHands:2,

    /*
       0 = más rápido
    */

    modelComplexity:0,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


/* =====================================================
   RESULTADOS
===================================================== */

hands.onResults(function(results){

    if(
        results &&
        results.multiHandLandmarks
    ){

        detectedHands =
            results.multiHandLandmarks;

    }else{

        detectedHands = [];

    }

});


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function resizeCanvases(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    const w =
        Math.floor(
            window.innerWidth / 2 * dpr
        );


    const h =
        Math.floor(
            window.innerHeight * dpr
        );


    leftCanvas.width = w;
    leftCanvas.height = h;


    rightCanvas.width = w;
    rightCanvas.height = h;

}


window.addEventListener(
    "resize",
    resizeCanvases
);


resizeCanvases();


/* =====================================================
   CÁMARA
===================================================== */

async function startCamera(){

    try{

        statusText.textContent =
            "ACTIVANDO CÁMARA TRASERA...";


        /*
        ---------------------------------------------
        PEDIR CÁMARA TRASERA
        ---------------------------------------------
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:60,
                        min:30
                    }

                },

                audio:false

            });


        /*
        ---------------------------------------------
        COLOCAR EL MISMO STREAM
        EN LOS DOS OJOS
        ---------------------------------------------
        */

        leftVideo.srcObject =
            stream;

        rightVideo.srcObject =
            stream;


        await leftVideo.play();

        await rightVideo.play();


        /*
        ---------------------------------------------
        INTENTAR 60 FPS
        ---------------------------------------------
        */

        const track =
            stream.getVideoTracks()[0];


        if(track){

            try{

                await track.applyConstraints({

                    frameRate:{
                        ideal:60,
                        max:60
                    }

                });

            }catch(e){

                console.log(
                    "60 FPS no disponible",
                    e
                );

            }

        }


        /*
        ---------------------------------------------
        ACTIVAR
        ---------------------------------------------
        */

        running = true;


        startScreen.style.display =
            "none";


        statusText.textContent =
            "CÁMARA TRASERA ACTIVA";


        /*
        ---------------------------------------------
        FULLSCREEN
        ---------------------------------------------
        */

        try{

            if(
                document.documentElement
                    .requestFullscreen
            ){

                await
                document.documentElement
                    .requestFullscreen();

            }

        }catch(e){}


        /*
        ---------------------------------------------
        INICIAR RENDER
        ---------------------------------------------
        */

        requestAnimationFrame(
            render
        );


    }catch(error){

        console.error(error);


        statusText.textContent =
            "ERROR DE CÁMARA";


        alert(
            "No se pudo acceder a la cámara.\n\n"
            +
            error.message
        );

    }

}


/* =====================================================
   DETECTAR MANOS
===================================================== */

async function detectHands(time){

    if(!running){

        return;

    }


    if(handsBusy){

        return;

    }


    if(
        time - lastDetection <
        HAND_INTERVAL
    ){

        return;

    }


    if(
        leftVideo.readyState < 2
    ){

        return;

    }


    lastDetection =
        time;


    handsBusy = true;


    try{

        await hands.send({

            image:leftVideo

        });

    }catch(error){

        console.error(
            "Error MediaPipe:",
            error
        );

    }


    handsBusy = false;

}


/* =====================================================
   DIBUJAR MANO
===================================================== */

function drawHand(
    ctx,
    landmarks,
    width,
    height
){

    ctx.save();


    /*
    ---------------------------------------------
    HUESOS
    ---------------------------------------------
    */

    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        3;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowBlur =
        14;

    ctx.shadowColor =
        "#00ffff";


    for(
        const connection
        of connections
    ){

        const a =
            landmarks[
                connection[0]
            ];

        const b =
            landmarks[
                connection[1]
            ];


        /*
           Cámara trasera:
           NO hacemos espejo.
        */

        const ax =
            a.x * width;

        const ay =
            a.y * height;


        const bx =
            b.x * width;

        const by =
            b.y * height;


        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.lineTo(
            bx,
            by
        );

        ctx.stroke();

    }


    /*
    ---------------------------------------------
    ARTICULACIONES
    ---------------------------------------------
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#00ffff";


    for(
        const p
        of landmarks
    ){

        const x =
            p.x * width;

        const y =
            p.y * height;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   DIBUJAR TODAS LAS MANOS
===================================================== */

function drawHands(
    ctx,
    canvas
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Como el canvas tiene un DPR mayor,
       las coordenadas se calculan usando
       su tamaño real.
    */

    for(
        const hand
        of detectedHands
    ){

        drawHand(

            ctx,

            hand,

            canvas.width,

            canvas.height

        );

    }

}


/* =====================================================
   RENDER
===================================================== */

function render(time){

    if(!running){

        return;

    }


    /*
    ---------------------------------------------
    DETECCIÓN
    ---------------------------------------------
    */

    detectHands(time);


    /*
    ---------------------------------------------
    HUESOS EN AMBOS OJOS
    ---------------------------------------------
    */

    drawHands(
        leftCtx,
        leftCanvas
    );


    drawHands(
        rightCtx,
        rightCanvas
    );


    /*
    ---------------------------------------------
    FPS DEL RENDER
    ---------------------------------------------
    */

    frames++;


    const now =
        performance.now();


    if(
        now - lastFPS >= 1000
    ){

        fpsText.textContent =
            "FPS: " + frames;


        frames = 0;

        lastFPS = now;


        if(
            detectedHands.length > 0
        ){

            statusText.textContent =
                detectedHands.length === 1
                ? "1 MANO DETECTADA"
                : detectedHands.length + " MANOS DETECTADAS";

        }else{

            statusText.textContent =
                "BUSCANDO MANOS...";

        }

    }


    requestAnimationFrame(
        render
    );

}


/* =====================================================
   BOTÓN
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);

</script>


</body>
</html>
