<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#030b14;--fg:#bfefff;--a:#00d4ff;--a2:#0a5d78;--card:rgba(0,212,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030b14}}
:root[data-theme="dark"]{--bg:#030b14}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#06263a,var(--bg) 70%);color:var(--fg);font-family:"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;letter-spacing:2px;color:var(--a);border-bottom:1px solid var(--a2)}
.core{position:relative;width:130px;height:130px;margin:14px auto 6px;flex:none}
.core i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);box-shadow:0 0 14px var(--a),inset 0 0 14px var(--a)}
.core i:nth-child(1){animation:spin 8s linear infinite;border-style:dashed}
.core i:nth-child(2){inset:16px;animation:spin 5s linear infinite reverse;border-style:dotted}
.core i:nth-child(3){inset:34px;border-width:3px}
.core b{position:absolute;inset:50px;border-radius:50%;background:#fff;box-shadow:0 0 30px 10px var(--a);animation:pulse 2s ease-in-out infinite}
.core.talk b{animation-duration:.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.4);opacity:.7}}
#clock{text-align:center;font-size:30px;letter-spacing:6px;color:var(--a);text-shadow:0 0 10px var(--a)}
#date{text-align:center;font-size:12px;opacity:.7;margin-bottom:6px;text-transform:capitalize}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--a2);font-size:15px;line-height:1.35;white-space:pre-wrap}
.m.u{align-self:flex-end;border-color:var(--a)}
.live{min-height:34px;text-align:center;padding:6px 14px;font-size:14px;color:var(--a);opacity:.85;font-style:italic}
#start{position:fixed;inset:0;z-index:9;background:rgba(3,11,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#start button{background:none;color:var(--a);border:2px solid var(--a);border-radius:30px;padding:16px 30px;font-size:18px;letter-spacing:3px;box-shadow:0 0 18px var(--a)}
#start p{margin:0;font-size:13px;opacity:.7;max-width:320px}
.core.listen i:nth-child(3){border-color:#4dff9d;box-shadow:0 0 14px #4dff9d,inset 0 0 14px #4dff9d}
</style>
</head>
<body>
<header><span>J.A.R.V.I.S.</span><span id="st">EN LÍNEA</span></header>
<div class="core" id="core"><i></i><i></i><i></i><b></b></div>
<div id="clock">--:--:--</div><div id="date"></div>
<div id="log"></div>
<div class="live" id="live">Pregúntame o dime lo que necesites</div>
<div id="start"><div style="font-size:22px;letter-spacing:4px;color:var(--a)">J.A.R.V.I.S.</div><button id="go">ACTIVAR</button><p>Toca una vez y permite el micrófono. Después escucha todo el tiempo y responde a lo que digas: «dime la hora», «cuéntame un chiste», «nuevo comando»… No cierres esta pestaña.</p></div>
<script>
const $=id=>document.getElementById(id),log=$('log');
let voice=true;
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('es');$('date').textContent=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
setInterval(tick,1000);tick();
function say(t){
  try{if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.95;u.pitch=.8;
  u.onstart=()=>$('core').classList.add('talk');u.onend=()=>$('core').classList.remove('talk');speechSynthesis.speak(u)}catch(e){}
}
function add(t,u){const d=document.createElement('div');d.className='m'+(u?' u':'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function reply(t){add(t);say(t)}
const jokes=["¿Por qué los pájaros vuelan al sur? Porque caminando tardarían demasiado.","Un byte entra a un bar y pide algo. El camarero: '¿Algo más?'. El byte: 'No, solo un bit.'","Mi lealtad es absoluta... salvo cuando se acaba la batería.","Dicen que soy artificial, pero mi sarcasmo es 100% natural."];
const facts=["La luz del Sol tarda unos 8 minutos en llegar a la Tierra.","Los pulpos tienen tres corazones.","Hay más estrellas en el universo que granos de arena en todas las playas."];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const clean=t=>norm(t).replace(/[¿?¡!.,;:]/g,' ').replace(/\s+/g,' ').trim();
let cmds=[];try{cmds=JSON.parse(localStorage.getItem('jarvis_cmds')||'[]')}catch(e){}
function saveCmds(){try{localStorage.setItem('jarvis_cmds',JSON.stringify(cmds))}catch(e){}}
function custom(n){
  const w=n.split(' ');
  for(const c of cmds){if(n===c.t||n.includes(c.t)||c.t.split(' ').every(x=>w.includes(x)))return c.r}
  return null;
}
function think(s){
  let c=s.replace(/\bmas\b/g,'+').replace(/\bmenos\b/g,'-').replace(/\bpor\b/g,'*').replace(/\b(entre|dividido por|dividido)\b/g,'/').replace(/\bx\b/g,'*').replace(/^(cuanto es|cuanto da|calcula|resuelve|dime cuanto es)\s*/,'');
  if(/^[\d\s.+\-*\/()%^]+$/.test(c)&&/\d\s*[+\-*\/%^]\s*\d/.test(c)){try{const r=Function('"use strict";return('+c.replace(/\^/g,'**')+')')();return 'El resultado es '+(+r.toFixed(6))+'.'}catch(e){}}
  const tm=s.match(/(temporizador|cuenta regresiva|avisame|alarma).*?(\d+)\s*(segundo|minuto|hora)/);
  if(tm){const k={segundo:1,minuto:60,hora:3600}[tm[3]]*+tm[2];setTimeout(()=>reply('Señor, el temporizador de '+tm[2]+' '+tm[3]+(tm[2]>1?'s':'')+' ha terminado.'),k*1000);return 'Temporizador de '+tm[2]+' '+tm[3]+(tm[2]>1?'s':'')+' en marcha.'}
  if(/\bhora\b|que horas/.test(s))return 'Son las '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+'.';
  if(/fecha|que dia|dia es|dia estamos|hoy es|en que mes|a cuanto estamos/.test(s))return 'Hoy es '+new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  if(/chiste|broma|hazme reir|algo gracioso|cuentame algo/.test(s))return pick(jokes);
  if(/dato|curiosidad|sabias que|algo interesante/.test(s))return pick(facts);
  if(/quien eres|que eres|como te llamas|tu nombre|presentate/.test(s))return 'Soy J.A.R.V.I.S., su asistente virtual. Corro directamente en su navegador.';
  if(/gracias|te lo agradezco|buen trabajo|eres genial/.test(s))return 'Siempre un placer, señor.';
  if(/como estas|que tal|como te va|como andas/.test(s))return 'Todos mis sistemas funcionan al cien por ciento. ¿Y usted?';
  if(/\b(hola|buenas|buenos dias|buenas tardes|buenas noches|hey|que onda|que hubo)\b/.test(s))return pick(['A su servicio, señor.','Buenas. ¿En qué puedo ayudarle?','Todos los sistemas operativos. Dígame.']);
  if(/estado|sistema|bateria|conexion/.test(s))return 'Sistemas al 100%. Conexión: '+(navigator.onLine?'estable':'sin red')+'. Núcleos: '+(navigator.hardwareConcurrency||'?')+'.';
  if(/dado|numero al azar|numero aleatorio/.test(s))return 'Saqué un '+(1+Math.floor(Math.random()*6))+'.';
  if(/moneda|cara o (cruz|sello)/.test(s))return pick(['Cara.','Cruz.']);
  if(/\b(silencio|callate|calla|mutea)\b/.test(s)){voice=false;return 'Voz desactivada.'}
  if(/activa (la )?voz|vuelve a hablar|puedes hablar/.test(s)){voice=true;return 'Voz activada.'}
  const q=s.match(/(youtube|google|wikipedia|busca)\s*(en google|en youtube|en wikipedia|de|sobre)?\s*(.*)/);
  if(q&&q[3]){const k=q[1]==='busca'?(/youtube/.test(q[2]||'')?'youtube':'google'):q[1];const u={youtube:'https://www.youtube.com/results?search_query=',google:'https://www.google.com/search?q=',wikipedia:'https://es.wikipedia.org/w/index.php?search='};window.open(u[k]+encodeURIComponent(q[3]),'_blank');return 'Buscando '+q[3]+' en '+k+'.'}
  return null;
}
function answer(n){return custom(n)||think(n)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const WAKE=/\b(jarvis|yarvis|jarvi|jarbis|yarbis|jervis)\b/g;
const QUICK=/\bhora\b|que horas|fecha|que dia|dia es|chiste|broma|dato|curiosidad|quien eres|como te llamas|gracias|como estas|que tal|\bhola\b|buenas|estado|dado|moneda|silencio|callate/;
let rec,on=false,speaking=false,handled=-1,vz=null,wl=null,teach=null;
function pickVoice(){
  const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^es/i.test(v.lang));
  if(!vs.length)return;
  const sc=v=>{const n=v.name.toLowerCase();let x=0;
    if(/natural|neural|online|premium|enhanced/.test(n))x+=8;
    if(/google/.test(n))x+=4;
    if(/jorge|diego|pablo|enrique|alvaro|raul|juan|carlos|miguel|male|hombre/.test(n))x+=3;
    if(/es-(mx|us|419|es)/i.test(v.lang))x+=1;return x};
  vz=vs.sort((p,q)=>sc(q)-sc(p))[0];
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
say=function(t){
  try{if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(vz){u.voice=vz;u.lang=vz.lang}
  u.rate=1.08;u.pitch=.95;
  u.onstart=()=>{speaking=true;$('core').classList.add('talk');try{rec.stop()}catch(e){}};
  u.onend=u.onerror=()=>{speaking=false;$('core').classList.remove('talk');listen()};
  speechSynthesis.speak(u)}catch(e){}
};
// ---- modo "nuevo comando": frase -> respuesta, se guarda en el dispositivo ----
function teachStep(raw,n){
  if(/\b(cancela|cancelar|olvidalo|déjalo|dejalo)\b/.test(n)){teach=null;reply('Cancelado.');return}
  if(teach.step===1){teach.t=n;teach.show=raw;teach.step=2;reply('Entendido: «'+raw+'». ¿Qué debo responder cuando lo escuche?');return}
  const i=cmds.findIndex(c=>c.t===teach.t);const c={t:teach.t,r:raw};
  if(i>=0)cmds[i]=c;else cmds.push(c);saveCmds();teach=null;
  reply('Listo. Cuando escuche «'+c.t+'», responderé: '+raw);
}
function process(raw,fin,idx){
  const n=clean(raw).replace(WAKE,' ').replace(/\s+/g,' ').trim();
  if(n.length<2)return;
  $('live').textContent='“'+raw.trim()+'”';
  if(teach){if(fin)teachStep(raw.trim(),n);return}
  if(fin&&/(nuevo|nueva|agrega\w*|anade|crea\w*|aprende) (un |una )?(comando|regla|frase)|^nuevo comando/.test(n)){teach={step:1};add(raw.trim(),1);reply('Muy bien. Dime la frase o comando que quieres que escuche.');return}
  if(fin&&/(mis|lista de|cuantos) comandos/.test(n)){add(raw.trim(),1);reply(cmds.length?'Tienes '+cmds.length+' comandos propios: '+cmds.map(c=>c.t).join(', ')+'.':'Aún no tienes comandos propios. Di «nuevo comando» para crear uno.');return}
  if(fin&&/(borra|elimina|olvida)\w* (el |todos los )?comandos?\s*(.*)/.test(n)){
    const t=n.replace(/.*(borra|elimina|olvida)\w* (el |todos los )?comandos?\s*/,'').trim();add(raw.trim(),1);
    if(!t||/todos/.test(n)){cmds=[];saveCmds();reply('He borrado todos tus comandos.')}
    else{const k=cmds.length;cmds=cmds.filter(c=>!(c.t.includes(t)||t.includes(c.t)));saveCmds();reply(k>cmds.length?'Comando eliminado.':'No encontré ese comando.')}
    return}
  const a=answer(n);
  if(a!==null){if(fin||QUICK.test(n)||custom(n)!==null){add(raw.trim(),1);reply(a);if(!fin)handled=idx}}
  else if(fin&&n.split(' ').length>=2){add(raw.trim(),1);reply('No sé responder eso todavía. Di «nuevo comando» y me lo enseñas.')}
}
function onResult(e){
  for(let i=e.resultIndex;i<e.results.length;i++){
    const r=e.results[i];
    if(i===handled){if(r.isFinal)handled=-1;continue}
    process(r[0].transcript,r.isFinal,i);
  }
}
function listen(){if(!on||speaking)return;try{rec.start()}catch(e){}}
function init(){
  rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onstart=()=>{$('core').classList.add('listen');$('st').textContent='ESCUCHANDO'};
  rec.onresult=onResult;
  rec.onend=()=>{$('core').classList.remove('listen');handled=-1;setTimeout(listen,60)};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('st').textContent='SIN MICRÓFONO';$('live').textContent='Permite el micrófono para usarme.'}};
}
async function keepAlive(){
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  try{
    if(!window._sil){const sr=8000,n=sr*2,b=new DataView(new ArrayBuffer(44+n));
      const w=(o,x)=>{for(let k=0;k<x.length;k++)b.setUint8(o+k,x.charCodeAt(k))};
      w(0,'RIFF');b.setUint32(4,36+n,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
      b.setUint32(24,sr,true);b.setUint32(28,sr,true);b.setUint16(32,1,true);b.setUint16(34,8,true);w(36,'data');b.setUint32(40,n,true);
      for(let k=0;k<n;k++)b.setUint8(44+k,128);
      window._sil=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));window._sil.loop=true;window._sil.volume=.02}
    await window._sil.play();
  }catch(e){}
  try{navigator.mediaSession.metadata=new MediaMetadata({title:'Jarvis escuchando',artist:'J.A.R.V.I.S.'})}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&on){keepAlive();listen()}});
$('go').onclick=()=>{
  if(!SR){$('start').innerHTML='<p style="font-size:15px">Este navegador no permite escuchar de forma continua. Prueba en Chrome (Android o PC).</p>';return}
  $('start').remove();on=true;init();listen();keepAlive();
  reply('Sistemas en línea. Te escucho, no hace falta que digas Jarvis.');
};
</script>
</body>
</html>
