<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner 3D holográfico</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #ojos { position: fixed; inset: 0; display: flex; z-index: 1; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  .ojo { --m: 3vmin; flex: 1; min-width: 0; position: relative; overflow: hidden; }
  body.vr .ojo { --m: 7vmin; }
  body:not(.vr) .ojo:nth-child(2) { display: none; }
  .ojo + .ojo { border-left: 1px solid #000; }
  .ojo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ojo::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 14vmin rgba(0,50,110,.55); }

  /* Panel de modelos guardados (arriba izquierda, transparente) */
  .panel { position: absolute; left: var(--m); top: var(--m); display: grid; grid-template-columns: repeat(2, 13vmin); gap: 1.2vmin; }
  .mini { aspect-ratio: 1; border: 1px solid rgba(76,201,255,.35); border-radius: 6px; background: rgba(20,100,180,.10); }

  /* Modelo actual (arriba derecha) */
  .holo { position: absolute; right: var(--m); top: var(--m); width: 38vmin; aspect-ratio: 1; }
  .holo::before { content: ""; position: absolute; inset: -4%; border: 1px dashed rgba(76,201,255,.45); border-radius: 50%; animation: giro 14s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .etq { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 2.8vmin; color: #bfefff; text-shadow: 0 0 6px #4cc9ff; }

  .est { position: absolute; bottom: var(--m); left: 50%; transform: translateX(-50%); font-size: 2.4vmin; color: #7fd8ff; text-shadow: 0 0 6px #000; white-space: nowrap; }
  #vr { position: fixed; bottom: 1.5vmin; left: 50%; transform: translateX(-50%); z-index: 9; opacity: .55;
        background: rgba(5,20,38,.8); color: #d8f1ff; border: 1px solid #4cc9ff; border-radius: 20px; padding: 6px 16px; font-size: 13px; }
</style>
</head>
<body>
<div id="ojos"></div>
<canvas id="gl"></canvas>
<button id="vr">Modo VR</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
/* ====== Parámetros (iguales para los dos ojos) ====== */
const IGNORAR = ['person'];   // clases que no se escanean
const SEP = 0.05;             // separación entre ojos del holograma (0 = sin profundidad)
const G = 28;                 // resolución de la malla
const MAX = 7;                // modelos guardados (1 actual + 6 en el panel)
const CONFIRMAR = 3;          // detecciones seguidas antes de crear el modelo

const ES = {bottle:'botella',cup:'taza','cell phone':'celular',laptop:'portátil',keyboard:'teclado',mouse:'ratón',tv:'televisor',
  chair:'silla',couch:'sofá',book:'libro',clock:'reloj',remote:'control remoto',scissors:'tijeras',backpack:'mochila',bowl:'tazón',
  apple:'manzana',orange:'naranja',knife:'cuchillo',fork:'tenedor',spoon:'cuchara',vase:'jarrón','potted plant':'planta',bed:'cama',
  'dining table':'mesa',cat:'gato',dog:'perro',car:'auto',bicycle:'bicicleta',umbrella:'paraguas',handbag:'bolso','wine glass':'copa',
  toothbrush:'cepillo de dientes','teddy bear':'peluche','sports ball':'pelota',bird:'pájaro'};

const $ = s => document.querySelector(s);
const est = t => document.querySelectorAll('.est').forEach(e => e.textContent = t);

/* ====== Dos ojos con la misma estructura ====== */
let vr = false;
const ojos = [0, 1].map(() => {
  const d = document.createElement('div');
  d.className = 'ojo';
  d.innerHTML = '<video autoplay playsinline muted></video><div class="panel">' + '<div class="mini"></div>'.repeat(6) +
                '</div><div class="holo"><span class="etq"></span></div><div class="est">Iniciando…</div>';
  $('#ojos').appendChild(d);
  return { video: d.querySelector('video'), holo: d.querySelector('.holo'), etq: d.querySelector('.etq'),
           minis: [...d.querySelectorAll('.mini')] };
});

/* ====== Three.js: un solo lienzo con una vista por recuadro ====== */
const R = new THREE.WebGLRenderer({ canvas: $('#gl'), alpha: true, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setClearColor(0x000000, 0);
R.autoClear = false;
const escena = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
const ajustar = () => R.setSize(innerWidth, innerHeight);
addEventListener('resize', ajustar); ajustar();

const mLin = new THREE.LineBasicMaterial({ color: 0x4cc9ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false });
const mPun = new THREE.PointsMaterial({ color: 0xa5ecff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });

/* ====== Malla 3D a partir del recorte del objeto ====== */
function crearModelo(v, [bx, by, bw, bh]) {
  const c = document.createElement('canvas');
  c.width = c.height = G;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, Math.max(0, bx), Math.max(0, by), bw, bh, 0, 0, G, G);
  const px = x.getImageData(0, 0, G, G).data;

  const m = Math.max(bw, bh), sx = bw / m, sy = bh / m, sz = 0.15 + 0.4 * Math.min(sx, sy);
  const cara = [[], []];
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const u = i / (G - 1) * 2 - 1, w = j / (G - 1) * 2 - 1;
    const r = Math.pow(Math.pow(Math.abs(u), 4) + Math.pow(Math.abs(w), 4), 0.25);
    const env = Math.sqrt(Math.max(0, 1 - r * r));                 // forma redondeada
    const o = (j * G + i) * 4;
    const L = (px[o] * 0.3 + px[o + 1] * 0.59 + px[o + 2] * 0.11) / 255;   // relieve según la luz del objeto
    const z = env * (0.55 + 0.45 * L) * sz;
    cara[0].push(u * sx, -w * sy, z);
    cara[1].push(u * sx, -w * sy, -z);
  }
  const seg = [];
  for (const s of cara) for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const a = (j * G + i) * 3;
    if (i < G - 1) seg.push(s[a], s[a + 1], s[a + 2], s[a + 3], s[a + 4], s[a + 5]);
    if (j < G - 1) { const b = a + G * 3; seg.push(s[a], s[a + 1], s[a + 2], s[b], s[b + 1], s[b + 2]); }
  }
  const gl = new THREE.BufferGeometry();
  gl.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
  const gp = new THREE.BufferGeometry();
  gp.setAttribute('position', new THREE.Float32BufferAttribute(cara[0].concat(cara[1]), 3));
  const g = new THREE.Group();
  g.add(new THREE.LineSegments(gl, mLin), new THREE.Points(gp, mPun));
  return { g, s: 0.95 / Math.hypot(sx, sy, sz) };
}

/* ====== Modelos guardados ====== */
let almacen = [];
const liberar = it => it.g.traverse(o => o.geometry && o.geometry.dispose());
const etiquetar = it => ojos.forEach(o => o.etq.textContent = it ? `${it.nombre} ${it.p}%` : '');

function agregar(c) {
  const { g, s } = crearModelo(ojos[0].video, c.bbox);
  almacen = almacen.filter(a => a.clase !== c.class || (liberar(a), false));
  almacen.unshift({ clase: c.class, nombre: ES[c.class] || c.class, p: Math.round(c.score * 100), g, s, t0: performance.now() });
  while (almacen.length > MAX) liberar(almacen.pop());
  etiquetar(almacen[0]);
}

/* ====== Dibujo (mismo contenido en cada ojo) ====== */
function dibujar(el, it, t) {
  if (!it) return;
  const r = el.getBoundingClientRect();
  if (!r.width) return;
  const vx = r.left, vy = innerHeight - r.bottom;
  R.setViewport(vx, vy, r.width, r.height);
  R.setScissor(vx, vy, r.width, r.height);
  const k = Math.min(1, (t - it.t0) / 500);
  it.g.rotation.set(0.25, t / 1100, 0);
  it.g.scale.setScalar(it.s * (1 - Math.pow(1 - k, 3) * 0.5));
  escena.clear(); escena.add(it.g);
  R.render(escena, cam);
}

function pintar(t) {
  requestAnimationFrame(pintar);
  R.setScissorTest(false);
  R.setViewport(0, 0, innerWidth, innerHeight);
  R.clear();
  R.setScissorTest(true);
  for (let k = 0; k < (vr ? 2 : 1); k++) {
    const o = ojos[k];
    cam.position.set(vr ? (k - 0.5) * 2 * SEP : 0, 0, 3.8);
    cam.lookAt(0, 0, 0);
    dibujar(o.holo, almacen[0], t);
    o.minis.forEach((e, i) => dibujar(e, almacen[i + 1], t));
  }
}

/* ====== Detección de objetos ====== */
let modelo, candidato = null, cuenta = 0;

function procesar(c) {
  if (!c) { candidato = null; cuenta = 0; est('Buscando objetos…'); return; }
  if (almacen[0] && c.class === almacen[0].clase) { candidato = null; cuenta = 0; est('Objeto: ' + almacen[0].nombre); return; }
  cuenta = c.class === candidato ? cuenta + 1 : 1;
  candidato = c.class;
  est('Escaneando ' + (ES[c.class] || c.class) + '…');
  if (cuenta >= CONFIRMAR) { agregar(c); candidato = null; cuenta = 0; }
}

async function detectar() {
  const v = ojos[0].video;
  if (v.readyState >= 2) {
    try {
      const r = await modelo.detect(v, 8);
      const c = r.filter(o => o.score >= 0.6 && !IGNORAR.includes(o.class))
                 .sort((a, b) => b.bbox[2] * b.bbox[3] - a.bbox[2] * a.bbox[3])[0];
      procesar(c);
    } catch (e) { est('Error: ' + e.message); }
  }
  setTimeout(detectar, 50);
}

/* ====== Modo VR (pantalla dividida) ====== */
$('#vr').onclick = async () => {
  vr = !vr;
  document.body.classList.toggle('vr', vr);
  $('#vr').textContent = vr ? 'Salir de VR' : 'Modo VR';
  try {
    if (vr) { await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }
    else { screen.orientation.unlock(); await document.exitFullscreen(); }
  } catch (e) {}
  ojos[1].video.play().catch(() => {});
};

/* ====== Inicio ====== */
(async () => {
  let s;
  try {
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    } catch (e) { s = await navigator.mediaDevices.getUserMedia({ video: true }); }
  } catch (e) { est('Cámara no disponible: ' + e.message); return; }
  ojos.forEach(o => { o.video.srcObject = s; o.video.play().catch(() => {}); });
  requestAnimationFrame(pintar);
  est('Cargando detector…');
  try { modelo = await cocoSsd.load({ base: 'lite_mobilenet_v2' }); }
  catch (e) { est('No se pudo cargar el detector (¿hay internet?)'); return; }
  est('Buscando objetos…');
  detectar();
})();
</script>
</body>
</html>
