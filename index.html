<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Box Esqueleto - MediaPipe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* Contenedores para cada lente del VR Box */
        .vr-eye {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #111;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo opcional */
        }
        #video {
            display: none;
        }
        /* Mensaje de carga inicial */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>

    <!-- Librerías de MediaPipe para Detección de Pose y Dibujo -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Iniciando cámara y modelo de IA...</div>

    <!-- Video oculto que captura la cámara -->
    <video id="video" autoplay playsinline></video>

    <!-- Pantalla Izquierda VR -->
    <div class="vr-eye">
        <canvas id="canvasLeft"></canvas>
    </div>

    <!-- Pantalla Derecha VR -->
    <div class="vr-eye">
        <canvas id="canvasRight"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasLeft = document.getElementById('canvasLeft');
        const canvasRight = document.getElementById('canvasRight');
        const ctxLeft = canvasLeft.getContext('2d');
        const ctxRight = canvasRight.getContext('2d');
        const loadingElement = document.getElementById('loading');

        function onResults(results) {
            // Ocultar mensaje de carga al recibir el primer frame
            if (loadingElement.style.display !== 'none') {
                loadingElement.style.display = 'none';
            }

            // Sincronizar dimensiones de los lienzos con el video
            if (canvasLeft.width !== videoElement.videoWidth) {
                canvasLeft.width = videoElement.videoWidth;
                canvasLeft.height = videoElement.videoHeight;
                canvasRight.width = videoElement.videoWidth;
                canvasRight.height = videoElement.videoHeight;
            }

            // Dibujar en el ojo izquierdo
            drawEye(ctxLeft, results);

            // Dibujar en el ojo derecho
            drawEye(ctxRight, results);
        }

        function drawEye(ctx, results) {
            ctx.save();
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            
            // 1. Dibujar el fotograma de la cámara de fondo
            ctx.drawImage(results.image, 0, 0, ctx.canvas.width, ctx.canvas.height);
            
            // 2. Dibujar el esqueleto digital si se detectan puntos corporales
            if (results.poseLandmarks) {
                // Conexiones del cuerpo (líneas)
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
                    color: '#00FFCC', 
                    lineWidth: 4
                });
                // Puntos articulares (nodos)
                drawLandmarks(ctx, results.poseLandmarks, {
                    color: '#FF0055', 
                    lineWidth: 2, 
                    radius: 4
                });
            }
            ctx.restore();
        }

        // Configuración de MediaPipe Pose
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,      // 0 = Ligero/Rápido, 1 = Balanceado, 2 = Preciso
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // Configuración de la cámara del dispositivo
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            loadingElement.innerText = "Error: No se pudo acceder a la cámara.";
            console.error(err);
        });
    </script>
</body>
</html>
