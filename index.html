<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>VR Hand Objects</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    touch-action:none;

}

#vr{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    display:flex;

    background:#000;

}

.eye{

    position:relative;

    width:50%;
    height:100%;

    overflow:hidden;

    background:#000;

}

.eye video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    background:#000;

}


/*
=====================================================
CANVAS

IMPORTANTE:

Aquí NO dibujamos los huesos.
Solo los objetos interactivos.
=====================================================
*/

.objectCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

}


#centerLine{

    position:fixed;

    left:50%;

    top:0;

    width:2px;

    height:100%;

    transform:translateX(-50%);

    background:#000;

    z-index:20;

    pointer-events:none;

}


#info{

    position:fixed;

    top:15px;

    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ffff;

    background:rgba(0,0,0,.55);

    border:2px solid rgba(0,255,255,.55);

    border-radius:10px;

    padding:8px 15px;

    font-size:12px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:

        0 0 8px #00ffff;

    white-space:nowrap;

    pointer-events:none;

}


#fps{

    position:fixed;

    top:15px;

    right:12px;

    z-index:50;

    color:#00ff88;

    background:rgba(0,0,0,.5);

    border:1px solid rgba(0,255,136,.4);

    border-radius:6px;

    padding:6px 9px;

    font-size:11px;

    font-family:monospace;

    pointer-events:none;

}


#status{

    position:fixed;

    bottom:15px;

    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ff88;

    font-size:12px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:

        0 0 8px #00ff88;

    white-space:nowrap;

    pointer-events:none;

}


#startScreen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    background:

        radial-gradient(

            circle,

            #082020 0%,

            #020707 45%,

            #000 100%

        );

}


#startScreen h1{

    font-size:clamp(

        28px,

        8vw,

        60px

    );

    letter-spacing:5px;

    margin-bottom:20px;

    color:#00ffff;

    text-shadow:

        0 0 10px #00ffff,

        0 0 25px #00ffff;

}


#startScreen p{

    width:85%;

    max-width:650px;

    color:#baffff;

    line-height:1.6;

    margin-bottom:30px;

}


#startButton{

    padding:18px 35px;

    color:#00ffff;

    background:#001818;

    border:2px solid #00ffff;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    box-shadow:

        0 0 12px #00ffff,

        inset 0 0 15px #003333;

}


#startButton:active{

    transform:scale(.94);

}

</style>

</head>


<body>


<!-- ==================================================
     VR
================================================== -->

<div id="vr">


    <div class="eye">

        <video
        id="leftVideo"
        autoplay
        muted
        playsinline></video>

        <canvas
        id="leftObjects"
        class="objectCanvas"></canvas>

    </div>


    <div class="eye">

        <video
        id="rightVideo"
        autoplay
        muted
        playsinline></video>

        <canvas
        id="rightObjects"
        class="objectCanvas"></canvas>

    </div>


</div>


<div id="centerLine"></div>


<div id="info">
VR HAND OBJECTS
</div>


<div id="fps">
VIDEO: -- | TRACK: --
</div>


<div id="status">
CÁMARA DESACTIVADA
</div>


<div id="startScreen">

    <h1>VR VISION</h1>

    <p>

        Haz 👌 para crear un punto.
        Haz 🤏 para agarrarlo.
        Mueve la mano para crear una trayectoria.

    </p>

    <button id="startButton">

        ACTIVAR CÁMARA

    </button>

</div>


<!-- ==================================================
     MEDIAPIPE
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const leftVideo =
    document.getElementById(
        "leftVideo"
    );

const rightVideo =
    document.getElementById(
        "rightVideo"
    );


const leftCanvas =
    document.getElementById(
        "leftObjects"
    );

const rightCanvas =
    document.getElementById(
        "rightObjects"
    );


const leftCtx =
    leftCanvas.getContext(
        "2d"
    );

const rightCtx =
    rightCanvas.getContext(
        "2d"
    );


const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const statusText =
    document.getElementById(
        "status"
    );


const fpsText =
    document.getElementById(
        "fps"
    );


/* =====================================================
   CONFIGURACIÓN
===================================================== */


/*
=====================================================
IMPORTANTE PARA EL RENDIMIENTO

La pantalla intenta renderizar a 60 FPS.

La detección de manos no necesita ejecutarse
60 veces por segundo.

La hacemos aproximadamente 25 veces/segundo.

Los objetos se interpolan entre detecciones.
=====================================================
*/

const HAND_INTERVAL = 40;


/*
Suavizado del movimiento.

Más alto = responde más rápido.

Más bajo = más suave.
*/

const SMOOTHING = 0.55;


/*
Distancias para reconocer gestos.

Son valores normalizados de MediaPipe.
*/

const OK_DISTANCE = 0.075;

const PINCH_DISTANCE = 0.065;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let running = false;

let detectorBusy = false;

let lastDetection = 0;


/*
Landmarks reales de MediaPipe.

NO SE DIBUJAN.
*/

let detectedHands = [];


/*
Landmarks suavizados.

Tampoco se dibujan.

Solo se utilizan para calcular
el movimiento y los gestos.
*/

let smoothHands = [];


/*
Objeto virtual.

Aquí guardamos los puntos creados.
*/

let points = [];


/*
¿Estamos agarrando un punto?
*/

let grabbedPoint = null;


/*
Posición actual de la mano.

No necesariamente se dibuja.
*/

let handTarget = null;

let handPosition = null;


/*
Última posición utilizada para crear
un nuevo punto.
*/

let lastTrailPosition = null;


/*
Evita crear muchos puntos por segundo.
*/

let lastPointTime = 0;


/*
FPS
*/

let renderFrames = 0;

let trackingFrames = 0;

let lastFPSUpdate =
    performance.now();


/* =====================================================
   CONEXIONES

   Se mantienen para que MediaPipe tenga
   toda la estructura de la mano disponible,
   pero NO LAS DIBUJAMOS.
===================================================== */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands = new Hands({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    /*
    Solo necesitamos una mano para
    controlar los objetos.

    Esto reduce bastante el consumo.
    */

    maxNumHands:1,


    /*
    0 = más rápido.

    Como los huesos ya NO SE DIBUJAN,
    podemos utilizar el detector rápido.
    */

    modelComplexity:0,


    minDetectionConfidence:0.65,

    minTrackingConfidence:0.65

});


/* =====================================================
   RESULTADOS
===================================================== */

hands.onResults(function(results){

    trackingFrames++;


    if(
        results &&
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        detectedHands =
            results.multiHandLandmarks;

    }else{

        detectedHands = [];

    }

});


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvases(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.25
        );


    const width =
        Math.floor(
            window.innerWidth / 2 *
            dpr
        );


    const height =
        Math.floor(
            window.innerHeight *
            dpr
        );


    leftCanvas.width =
        width;

    leftCanvas.height =
        height;


    rightCanvas.width =
        width;

    rightCanvas.height =
        height;

}


window.addEventListener(
    "resize",
    resizeCanvases
);


resizeCanvases();


/* =====================================================
   CÁMARA
===================================================== */

async function startCamera(){

    try{

        statusText.textContent =
            "ACTIVANDO CÁMARA...";


        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{

                        ideal:60,

                        min:30,

                        max:60

                    }

                },

                audio:false

            });


        leftVideo.srcObject =
            stream;

        rightVideo.srcObject =
            stream;


        await leftVideo.play();

        await rightVideo.play();


        /*
        Intentar 60 FPS reales.
        */

        const track =
            stream.getVideoTracks()[0];


        if(track){

            try{

                await track.applyConstraints({

                    frameRate:{

                        ideal:60,

                        max:60

                    }

                });

            }catch(e){

                console.log(
                    "FPS automático:",
                    e
                );

            }

        }


        running = true;


        startScreen.style.display =
            "none";


        statusText.textContent =
            "HAZ 👌 PARA CREAR UN PUNTO";


        /*
        Pantalla completa.
        */

        try{

            if(
                document.documentElement
                .requestFullscreen
            ){

                await document
                .documentElement
                .requestFullscreen();

            }

        }catch(e){}


        requestAnimationFrame(
            render
        );


    }catch(error){

        console.error(error);


        statusText.textContent =
            "ERROR DE CÁMARA";


        alert(
            "No se pudo iniciar la cámara.\n\n"
            +
            error.message
        );

    }

}


/* =====================================================
   DETECTAR MANOS
===================================================== */

async function detectHands(time){

    if(!running){

        return;

    }


    if(detectorBusy){

        return;

    }


    if(
        time - lastDetection <
        HAND_INTERVAL
    ){

        return;

    }


    if(
        leftVideo.readyState < 2
    ){

        return;

    }


    lastDetection =
        time;


    detectorBusy = true;


    try{

        await hands.send({

            image:leftVideo

        });

    }catch(error){

        console.log(
            "MediaPipe:",
            error
        );

    }


    detectorBusy = false;

}


/* =====================================================
   SUAVIZAR LANDMARKS
===================================================== */

function updateSmoothHands(){

    if(
        detectedHands.length === 0
    ){

        smoothHands = [];

        return;

    }


    /*
    Primera detección.
    */

    if(
        smoothHands.length === 0
    ){

        smoothHands =
            detectedHands.map(

                hand =>

                hand.map(

                    p => ({

                        x:p.x,

                        y:p.y,

                        z:p.z

                    })

                )

            );

        return;

    }


    const target =
        detectedHands[0];


    const current =
        smoothHands[0];


    if(!current){

        return;

    }


    for(
        let i=0;
        i<target.length;
        i++
    ){

        current[i].x +=
            (
                target[i].x -
                current[i].x
            )
            *
            SMOOTHING;


        current[i].y +=
            (
                target[i].y -
                current[i].y
            )
            *
            SMOOTHING;


        current[i].z +=
            (
                target[i].z -
                current[i].z
            )
            *
            SMOOTHING;

    }

}


/* =====================================================
   DISTANCIA ENTRE DOS PUNTOS
===================================================== */

function distance(a,b){

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const dz =
        (a.z - b.z) * 0.5;


    return Math.sqrt(

        dx*dx +
        dy*dy +
        dz*dz

    );

}


/* =====================================================
   DETECTAR GESTO 👌
===================================================== */

function isOKGesture(hand){

    /*
    Pulgar = 4

    Índice = 8

    Medio = 12

    Anular = 16

    Meñique = 20
    */


    const thumb =
        hand[4];

    const index =
        hand[8];

    const middle =
        hand[12];

    const ring =
        hand[16];

    const pinky =
        hand[20];


    /*
    Pulgar e índice juntos.
    */

    const pinch =
        distance(
            thumb,
            index
        );


    /*
    Los otros dedos deben estar
    relativamente alejados.
    */

    const middleOpen =
        distance(
            hand[9],
            middle
        ) > 0.12;


    const ringOpen =
        distance(
            hand[13],
            ring
        ) > 0.10;


    const pinkyOpen =
        distance(
            hand[17],
            pinky
        ) > 0.08;


    return (

        pinch < OK_DISTANCE &&

        middleOpen &&

        ringOpen &&

        pinkyOpen

    );

}


/* =====================================================
   DETECTAR PINZA 🤏
===================================================== */

function isPinch(hand){

    if(!hand){

        return false;

    }


    const thumb =
        hand[4];

    const index =
        hand[8];


    return (

        distance(
            thumb,
            index
        )
        <
        PINCH_DISTANCE

    );

}


/* =====================================================
   POSICIÓN DE CONTROL
===================================================== */

function getControlPosition(hand){

    /*
    Utilizamos el punto medio entre
    pulgar e índice.

    Esto es más estable para agarrar
    objetos.
    */

    const thumb =
        hand[4];

    const index =
        hand[8];


    return {

        x:
            (thumb.x + index.x)
            / 2,

        y:
            (thumb.y + index.y)
            / 2

    };

}


/* =====================================================
   CREAR PUNTO
===================================================== */

function createPoint(position){

    points.push({

        x:position.x,

        y:position.y,

        grabbed:false,

        radius:9,

        created:
            performance.now()

    });

}


/* =====================================================
   BUSCAR PUNTO CERCANO
===================================================== */

function findClosestPoint(position){

    let closest =
        null;

    let closestDistance =
        999;


    for(
        const point
        of points
    ){

        const dx =
            point.x -
            position.x;

        const dy =
            point.y -
            position.y;


        const d =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        /*
        Radio de agarre.

        0.07 aproximadamente 7%
        del ancho de pantalla.
        */

        if(
            d < 0.07 &&
            d < closestDistance
        ){

            closest =
                point;

            closestDistance =
                d;

        }

    }


    return closest;

}


/* =====================================================
   ACTUALIZAR OBJETOS
===================================================== */

function updateInteraction(){

    if(
        smoothHands.length === 0
    ){

        return;

    }


    const hand =
        smoothHands[0];


    const position =
        getControlPosition(
            hand
        );


    handPosition =
        position;


    const ok =
        isOKGesture(
            hand
        );


    const pinch =
        isPinch(
            hand
        );


    /*
    =================================================
    👌 CREAR PUNTO
    =================================================
    */

    if(
        ok &&
        !grabbedPoint
    ){

        /*
        No crear 100 puntos seguidos.
        */

        const now =
            performance.now();


        if(
            now - lastPointTime >
            500
        ){

            createPoint(
                position
            );


            lastPointTime =
                now;

        }

    }


    /*
    =================================================
    🤏 AGARRAR
    =================================================
    */

    if(
        pinch &&
        !grabbedPoint
    ){

        const closest =
            findClosestPoint(
                position
            );


        if(closest){

            grabbedPoint =
                closest;

            grabbedPoint.grabbed =
                true;

            grabbedPoint.radius =
                14;


            lastTrailPosition = {

                x:
                    position.x,

                y:
                    position.y

            };

        }

    }


    /*
    =================================================
    SOLTAR
    =================================================
    */

    if(
        !pinch &&
        grabbedPoint
    ){

        grabbedPoint.grabbed =
            false;

        grabbedPoint.radius =
            9;

        grabbedPoint =
            null;

        lastTrailPosition =
            null;

    }


    /*
    =================================================
    MOVER PUNTO
    =================================================
    */

    if(
        grabbedPoint &&
        pinch
    ){

        grabbedPoint.x =
            position.x;

        grabbedPoint.y =
            position.y;


        /*
        ---------------------------------------------
        CREAR COPIA / TRAZA
        ---------------------------------------------
        */

        if(
            lastTrailPosition
        ){

            const dx =
                position.x -
                lastTrailPosition.x;

            const dy =
                position.y -
                lastTrailPosition.y;


            const movement =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            /*
            Solo crear otro punto si realmente
            movimos la mano una distancia mínima.
            */

            if(
                movement > 0.025
            ){

                points.push({

                    x:
                        position.x,

                    y:
                        position.y,

                    grabbed:false,

                    radius:7,

                    trail:true,

                    created:
                        performance.now()

                });


                lastTrailPosition = {

                    x:
                        position.x,

                    y:
                        position.y

                };

            }

        }

    }

}


/* =====================================================
   DIBUJAR OBJETOS
===================================================== */

function drawScene(
    ctx,
    canvas
){

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
    =================================================
    LÍNEAS
    =================================================
    */

    if(
        points.length > 1
    ){

        ctx.save();


        ctx.strokeStyle =
            "rgba(0,255,255,.75)";


        ctx.lineWidth =
            3;


        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            "#00ffff";


        ctx.beginPath();


        for(
            let i=0;
            i<points.length;
            i++
        ){

            const point =
                points[i];


            const x =
                point.x *
                canvas.width;


            const y =
                point.y *
                canvas.height;


            if(
                i===0
            ){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }


        ctx.stroke();


        ctx.restore();

    }


    /*
    =================================================
    PUNTOS
    =================================================
    */

    for(
        const point
        of points
    ){

        const x =
            point.x *
            canvas.width;


        const y =
            point.y *
            canvas.height;


        const radius =
            point.radius;


        ctx.save();


        /*
        Punto agarrado = rojo.

        Punto normal = blanco.
        */

        if(
            point.grabbed
        ){

            ctx.fillStyle =
                "#ff2020";

            ctx.shadowColor =
                "#ff0000";

            ctx.shadowBlur =
                25;

        }else{

            ctx.fillStyle =
                "#ffffff";

            ctx.shadowColor =
                "#ffffff";

            ctx.shadowBlur =
                18;

        }


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            radius,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }

}


/* =====================================================
   FPS
===================================================== */

function updateFPS(){

    const now =
        performance.now();


    if(
        now - lastFPSUpdate >= 1000
    ){

        fpsText.textContent =
            "VIDEO: " +
            Math.round(
                renderFrames
            ) +
            " | TRACK: " +
            trackingFrames;


        renderFrames = 0;

        trackingFrames = 0;

        lastFPSUpdate =
            now;

    }

}


/* =====================================================
   RENDER PRINCIPAL
===================================================== */

function render(time){

    if(!running){

        return;

    }


    /*
    ---------------------------------------------
    MediaPipe
    ---------------------------------------------
    */

    detectHands(
        time
    );


    /*
    ---------------------------------------------
    Suavizado invisible
    ---------------------------------------------
    */

    updateSmoothHands();


    /*
    ---------------------------------------------
    LÓGICA DE GESTOS
    ---------------------------------------------
    */

    updateInteraction();


    /*
    ---------------------------------------------
    SOLO DIBUJAMOS OBJETOS

    LOS HUESOS NO SE DIBUJAN.
    ---------------------------------------------
    */

    drawScene(
        leftCtx,
        leftCanvas
    );


    drawScene(
        rightCtx,
        rightCanvas
    );


    /*
    ---------------------------------------------
    FPS
    ---------------------------------------------
    */

    renderFrames++;


    updateFPS();


    /*
    ---------------------------------------------
    SIGUIENTE FRAME
    ---------------------------------------------
    */

    requestAnimationFrame(
        render
    );

}


/* =====================================================
   BOTÓN
===================================================== */

startButton.addEventListener(

    "click",

    startCamera

);

</script>

</body>

</html>
