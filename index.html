<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>VR Quest Hand Browser</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;
}


/* =====================================================
   VR
===================================================== */

#vr{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    display:flex;

    background:#000;

}


.eye{

    position:relative;

    width:50%;
    height:100%;

    overflow:hidden;

    background:#000;

}


.eye video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

}


/* =====================================================
   MANOS
===================================================== */

.handCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:10;

}


/* =====================================================
   SEPARADOR
===================================================== */

#centerLine{

    position:fixed;

    top:0;
    left:50%;

    width:3px;
    height:100%;

    transform:
        translateX(-50%);

    background:#000;

    z-index:100;

}


/* =====================================================
   INTERFAZ VR
===================================================== */

#vrUI{

    position:fixed;

    inset:0;

    z-index:30;

    pointer-events:none;

    perspective:1400px;

}


/* =====================================================
   VENTANA QUEST
===================================================== */

#questWindow{

    position:absolute;

    left:50%;
    top:50%;

    width:min(
        680px,
        70vw
    );

    height:min(
        430px,
        55vh
    );

    transform:

        translate(-50%,-50%)

        rotateX(0deg)

        rotateY(0deg)

        translateZ(0px);

    transform-style:preserve-3d;

    background:

        linear-gradient(
            145deg,
            rgba(35,38,45,.98),
            rgba(10,11,15,.98)
        );

    border:

        1px solid
        rgba(255,255,255,.16);

    border-radius:24px;

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.8),

        0 0 35px
        rgba(255,255,255,.05);

    overflow:hidden;

    pointer-events:auto;

    transition:

        box-shadow .15s ease;

}


/* =====================================================
   VENTANA AGARRADA
===================================================== */

#questWindow.grabbed{

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.9),

        0 0 35px
        rgba(0,220,255,.18);

}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.questTop{

    height:58px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:

        0 14px;

    background:

        rgba(28,30,36,.98);

    border-bottom:

        1px solid
        rgba(255,255,255,.1);

}


/* =====================================================
   BOTONES
===================================================== */

.questButton{

    width:32px;
    height:32px;

    border-radius:50%;

    border:none;

    background:

        rgba(255,255,255,.08);

    color:#fff;

    font-size:15px;

}


.questButton:active{

    transform:scale(.9);

}


/* =====================================================
   URL
===================================================== */

#urlBox{

    flex:1;

    height:38px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:

        0 12px;

    background:

        rgba(0,0,0,.38);

    border:

        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

}


#urlInput{

    width:100%;

    border:none;

    outline:none;

    background:transparent;

    color:#eee;

    font-size:14px;

}


#goButton{

    width:35px;

    height:30px;

    border:none;

    border-radius:8px;

    background:#2b2d32;

    color:#fff;

}


/* =====================================================
   CONTENIDO
===================================================== */

#browserArea{

    position:absolute;

    left:0;
    right:0;

    top:58px;
    bottom:0;

    background:#111;

}


#browserFrame{

    width:100%;
    height:100%;

    border:none;

    background:#fff;

}


/* =====================================================
   PANTALLA DE INICIO
===================================================== */

#questHome{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at 50% 35%,
            #252a35,
            #111318 45%,
            #090a0d 100%
        );

    color:#fff;

}


#questLogo{

    width:80px;
    height:80px;

    border-radius:25px;

    background:

        linear-gradient(
            145deg,
            #fff,
            #9ba1ab
        );

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.6);

    margin-bottom:22px;

}


#questHome h1{

    font-size:27px;

    margin-bottom:10px;

}


#questHome p{

    color:#aeb3bc;

    font-size:14px;

}


/* =====================================================
   INFORMACIÓN
===================================================== */

#info{

    position:fixed;

    top:14px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:150;

    color:#00ffff;

    background:
        rgba(0,0,0,.55);

    border:

        1px solid
        rgba(0,255,255,.4);

    border-radius:10px;

    padding:
        7px 12px;

    font-size:11px;

    letter-spacing:2px;

    pointer-events:none;

}


#fps{

    position:fixed;

    top:14px;
    right:12px;

    z-index:150;

    padding:7px 9px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(0,255,100,.3);

    border-radius:7px;

    color:#00ff88;

    font:

        11px monospace;

    pointer-events:none;

}


#status{

    position:fixed;

    bottom:14px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:150;

    color:#fff;

    font-size:12px;

    text-shadow:
        0 0 8px #000;

    pointer-events:none;

}


/* =====================================================
   PANTALLA INICIAL
===================================================== */

#startScreen{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:

        radial-gradient(
            circle,
            #1a202b,
            #050608 70%
        );

    color:white;

}


#startScreen h1{

    font-size:40px;

    letter-spacing:5px;

    color:white;

    margin-bottom:15px;

}


#startScreen p{

    width:85%;

    max-width:550px;

    line-height:1.6;

    color:#aaa;

    margin-bottom:25px;

}


#startButton{

    padding:

        16px 30px;

    border:

        1px solid
        rgba(255,255,255,.5);

    border-radius:14px;

    background:#20242c;

    color:white;

    font-size:16px;

}

</style>

</head>


<body>


<!-- ==================================================
     CÁMARAS
================================================== -->

<div id="vr">


    <div class="eye">

        <video
            id="leftVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="leftHands"
            class="handCanvas">
        </canvas>

    </div>


    <div class="eye">

        <video
            id="rightVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="rightHands"
            class="handCanvas">
        </canvas>

    </div>


</div>


<div id="centerLine"></div>


<!-- ==================================================
     UI QUEST
================================================== -->

<div id="vrUI">


    <div id="questWindow">


        <!-- BARRA -->

        <div
            class="questTop"
            id="windowBar">


            <button
                class="questButton"
                id="backButton">

                ‹

            </button>


            <button
                class="questButton"
                id="forwardButton">

                ›

            </button>


            <button
                class="questButton"
                id="reloadButton">

                ↻

            </button>


            <div id="urlBox">

                <span>🌐</span>

                <input
                    id="urlInput"
                    value="https://example.com"
                    autocomplete="off">

                <button id="goButton">

                    ↵

                </button>

            </div>


        </div>


        <!-- NAVEGADOR -->

        <div id="browserArea">


            <div id="questHome">

                <div id="questLogo"></div>

                <h1>
                    Meta Browser
                </h1>

                <p>
                    Haz pinch sobre la ventana
                    para moverla.
                </p>

            </div>


            <iframe
                id="browserFrame"
                src="about:blank">
            </iframe>


        </div>


    </div>


</div>


<!-- ==================================================
     INFORMACIÓN
================================================== -->

<div id="info">

    QUEST HAND BROWSER

</div>


<div id="fps">

    VIDEO: -- | HAND: --

</div>


<div id="status">

    HAZ PINCH PARA AGARRAR

</div>


<!-- ==================================================
     INICIO
================================================== -->

<div id="startScreen">

    <h1>
        META VR
    </h1>

    <p>

        Cámara trasera + seguimiento de manos.
        Haz pinch sobre la ventana para agarrarla
        y moverla.

    </p>


    <button id="startButton">

        ACTIVAR VR

    </button>

</div>


<!-- ==================================================
     MEDIAPIPE
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const leftVideo =
    document.getElementById(
        "leftVideo"
    );

const rightVideo =
    document.getElementById(
        "rightVideo"
    );

const leftCanvas =
    document.getElementById(
        "leftHands"
    );

const rightCanvas =
    document.getElementById(
        "rightHands"
    );

const leftCtx =
    leftCanvas.getContext("2d");

const rightCtx =
    rightCanvas.getContext("2d");

const questWindow =
    document.getElementById(
        "questWindow"
    );

const windowBar =
    document.getElementById(
        "windowBar"
    );

const browserFrame =
    document.getElementById(
        "browserFrame"
    );

const questHome =
    document.getElementById(
        "questHome"
    );

const urlInput =
    document.getElementById(
        "urlInput"
    );

const goButton =
    document.getElementById(
        "goButton"
    );

const reloadButton =
    document.getElementById(
        "reloadButton"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const statusText =
    document.getElementById(
        "status"
    );

const fpsText =
    document.getElementById(
        "fps"
    );


/* =====================================================
   CONFIGURACIÓN
===================================================== */


/*
   El modelo usa precisión alta.
*/

const HAND_INTERVAL = 45;


/*
   Suavizado de la mano.
*/

const SMOOTHING = .42;


/*
   Distancia para considerar pinch.
*/

const PINCH_DISTANCE = .065;


/*
   Escala del movimiento de la mano
   respecto al movimiento de la ventana.
*/

const MOVE_SCALE = 2.2;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let running = false;

let detectorBusy = false;

let lastDetection = 0;

let detectedHands = [];

let smoothHand = null;


/*
   Estado de pinch.
*/

let pinching = false;

let dragging = false;


/*
   Posición anterior del pinch.
*/

let previousPinch = null;


/*
   Posición 3D de la ventana.
*/

let windowX = 0;

let windowY = 0;

let windowZ = 0;


/*
   Rotación.
*/

let windowRX = 0;

let windowRY = 0;


/*
   FPS.
*/

let renderFrames = 0;

let handFrames = 0;

let lastFPS =
    performance.now();


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile:function(file){

            return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

        }

    });


hands.setOptions({

    /*
       Más precisión.
    */

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:.80,

    minTrackingConfidence:.80

});


/* =====================================================
   RESULTADOS
===================================================== */

hands.onResults(
    function(results){

        handFrames++;


        if(
            results &&
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length
        ){

            detectedHands =
                results.multiHandLandmarks[0];

        }else{

            detectedHands =
                null;

        }

    }
);


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.25
        );


    const width =
        Math.floor(
            window.innerWidth /
            2 *
            dpr
        );


    const height =
        Math.floor(
            window.innerHeight *
            dpr
        );


    leftCanvas.width =
        width;

    leftCanvas.height =
        height;


    rightCanvas.width =
        width;

    rightCanvas.height =
        height;

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =====================================================
   CÁMARA
===================================================== */

async function startCamera(){

    try{

        statusText.textContent =
            "ACTIVANDO CÁMARA...";


        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:60,
                        min:30,
                        max:60
                    }

                },

                audio:false

            });


        leftVideo.srcObject =
            stream;

        rightVideo.srcObject =
            stream;


        await leftVideo.play();

        await rightVideo.play();


        /*
           Intentar utilizar 60 FPS.
        */

        const track =
            stream.getVideoTracks()[0];


        try{

            await track.applyConstraints({

                frameRate:{
                    ideal:60,
                    max:60
                }

            });

        }catch(e){

            console.log(e);

        }


        running = true;


        startScreen.style.display =
            "none";


        statusText.textContent =
            "HAZ PINCH SOBRE LA VENTANA";


        /*
           Pantalla completa.
        */

        try{

            await document
                .documentElement
                .requestFullscreen();

        }catch(e){}


        requestAnimationFrame(
            render
        );


    }catch(error){

        console.error(error);


        alert(
            "No se pudo activar la cámara:\n\n"
            +
            error.message
        );

    }

}


/* =====================================================
   DETECCIÓN
===================================================== */

async function detectHands(time){

    if(!running){

        return;

    }


    if(detectorBusy){

        return;

    }


    if(
        time -
        lastDetection <
        HAND_INTERVAL
    ){

        return;

    }


    if(
        leftVideo.readyState < 2
    ){

        return;

    }


    lastDetection =
        time;


    detectorBusy = true;


    try{

        await hands.send({

            image:leftVideo

        });

    }catch(error){

        console.log(error);

    }


    detectorBusy = false;

}


/* =====================================================
   SUAVIZAR
===================================================== */

function smoothLandmarks(){

    if(!detectedHands){

        smoothHand =
            null;

        return;

    }


    if(!smoothHand){

        smoothHand =
            detectedHands.map(

                p => ({

                    x:p.x,
                    y:p.y,
                    z:p.z

                })

            );

        return;

    }


    for(
        let i=0;
        i<detectedHands.length;
        i++
    ){

        const target =
            detectedHands[i];

        const current =
            smoothHand[i];


        current.x +=
            (
                target.x -
                current.x
            )
            *
            SMOOTHING;


        current.y +=
            (
                target.y -
                current.y
            )
            *
            SMOOTHING;


        current.z +=
            (
                target.z -
                current.z
            )
            *
            SMOOTHING;

    }

}


/* =====================================================
   DISTANCIA
===================================================== */

function distance(a,b){

    const dx =
        a.x-b.x;

    const dy =
        a.y-b.y;

    const dz =
        (a.z-b.z)*.5;


    return Math.sqrt(

        dx*dx+
        dy*dy+
        dz*dz

    );

}


/* =====================================================
   PINCH
===================================================== */

function isPinching(hand){

    if(!hand){

        return false;

    }


    return (

        distance(
            hand[4],
            hand[8]
        )
        <
        PINCH_DISTANCE

    );

}


/* =====================================================
   POSICIÓN DEL PINCH
===================================================== */

function getPinchPosition(hand){

    return {

        x:
            (
                hand[4].x+
                hand[8].x
            )/2,

        y:
            (
                hand[4].y+
                hand[8].y
            )/2

    };

}


/* =====================================================
   APLICAR TRANSFORMACIÓN
===================================================== */

function updateWindowTransform(){

    questWindow.style.transform =

        "translate(" +

        "calc(-50% + " +
        windowX +
        "px)," +

        "calc(-50% + " +
        windowY +
        "px)" +

        ") " +

        "rotateX(" +
        windowRX +
        "deg) " +

        "rotateY(" +
        windowRY +
        "deg) " +

        "translateZ(" +
        windowZ +
        "px)";

}


/* =====================================================
   DETECTAR POSICIÓN DE LA VENTANA
===================================================== */

function getWindowRect(){

    return questWindow.getBoundingClientRect();

}


/* =====================================================
   PINCH SOBRE VENTANA
===================================================== */

function pinchIsInsideWindow(pos){

    const rect =
        getWindowRect();


    /*
       Convertir coordenadas normalizadas
       de MediaPipe a pantalla.

       La cámara trasera puede estar
       espejada dependiendo del dispositivo.
    */

    const screenX =
        (1-pos.x) *
        window.innerWidth;


    const screenY =
        pos.y *
        window.innerHeight;


    return (

        screenX >= rect.left &&

        screenX <= rect.right &&

        screenY >= rect.top &&

        screenY <= rect.bottom

    );

}


/* =====================================================
   INTERACCIÓN
===================================================== */

function updateInteraction(){

    if(!smoothHand){

        if(dragging){

            dragging = false;

            questWindow.classList
                .remove("grabbed");

        }

        previousPinch = null;

        return;

    }


    const pinch =
        isPinching(
            smoothHand
        );


    const pos =
        getPinchPosition(
            smoothHand
        );


    /*
    =================================================
    INICIO DEL PINCH
    =================================================
    */

    if(
        pinch &&
        !pinching
    ){

        pinching = true;


        /*
           ¿El dedo está sobre la ventana?
        */

        if(
            pinchIsInsideWindow(
                pos
            )
        ){

            dragging = true;


            questWindow.classList
                .add("grabbed");


            previousPinch = {

                x:pos.x,

                y:pos.y

            };


            statusText.textContent =
                "VENTANA AGARRADA";

        }

    }


    /*
    =================================================
    MOVER VENTANA
    =================================================
    */

    if(
        pinch &&
        dragging &&
        previousPinch
    ){

        const dx =
            pos.x -
            previousPinch.x;


        const dy =
            pos.y -
            previousPinch.y;


        /*
           Movimiento horizontal.
        */

        windowX +=
            dx *
            window.innerWidth *
            MOVE_SCALE;


        /*
           Movimiento vertical.
        */

        windowY +=
            dy *
            window.innerHeight *
            MOVE_SCALE;


        /*
           Limitar para no perder la ventana.
        */

        const maxX =
            window.innerWidth *
            .40;


        const maxY =
            window.innerHeight *
            .40;


        windowX =
            Math.max(
                -maxX,
                Math.min(
                    maxX,
                    windowX
                )
            );


        windowY =
            Math.max(
                -maxY,
                Math.min(
                    maxY,
                    windowY
                )
            );


        updateWindowTransform();


        previousPinch = {

            x:pos.x,

            y:pos.y

        };

    }


    /*
    =================================================
    SOLTAR
    =================================================
    */

    if(
        !pinch &&
        pinching
    ){

        pinching = false;


        if(dragging){

            dragging = false;

            questWindow.classList
                .remove("grabbed");

            statusText.textContent =
                "HAZ PINCH SOBRE LA VENTANA";

        }


        previousPinch = null;

    }

}


/* =====================================================
   DIBUJAR MANOS
===================================================== */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


function drawHand(
    ctx,
    canvas
){

    if(!smoothHand){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       HUESOS
    */

    ctx.save();


    ctx.strokeStyle =
        "rgba(0,255,255,.8)";

    ctx.lineWidth =
        2.5;

    ctx.shadowBlur =
        8;

    ctx.shadowColor =
        "#00ffff";


    for(
        const c
        of connections
    ){

        const a =
            smoothHand[c[0]];

        const b =
            smoothHand[c[1]];


        ctx.beginPath();


        ctx.moveTo(

            (1-a.x) *
            canvas.width,

            a.y *
            canvas.height

        );


        ctx.lineTo(

            (1-b.x) *
            canvas.width,

            b.y *
            canvas.height

        );


        ctx.stroke();

    }


    /*
       PUNTOS
    */

    ctx.fillStyle =
        "#fff";

    ctx.shadowBlur =
        14;

    ctx.shadowColor =
        "#00ffff";


    for(
        const p
        of smoothHand
    ){

        ctx.beginPath();


        ctx.arc(

            (1-p.x) *
            canvas.width,

            p.y *
            canvas.height,

            3.5,

            0,

            Math.PI*2

        );


        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   BOTONES DEL NAVEGADOR
===================================================== */

goButton.addEventListener(
    "click",
    loadURL
);


urlInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            loadURL();

        }

    }
);


function loadURL(){

    let url =
        urlInput.value.trim();


    if(!url){

        return;

    }


    if(
        !/^https?:\/\//i.test(url)
    ){

        url =
            "https://" +
            url;

    }


    /*
       Mostrar iframe.
    */

    questHome.style.display =
        "none";


    browserFrame.style.display =
        "block";


    browserFrame.src =
        url;

}


reloadButton.addEventListener(
    "click",
    function(){

        try{

            browserFrame
                .contentWindow
                .location
                .reload();

        }catch(e){

            browserFrame.src =
                browserFrame.src;

        }

    }
);


/* =====================================================
   RENDER
===================================================== */

function render(time){

    if(!running){

        return;

    }


    /*
       Detección.
    */

    detectHands(time);


    /*
       Suavizado.
    */

    smoothLandmarks();


    /*
       Interacción.
    */

    updateInteraction();


    /*
       Dibujar manos.
    */

    drawHand(
        leftCtx,
        leftCanvas
    );


    drawHand(
        rightCtx,
        rightCanvas
    );


    /*
       FPS.
    */

    renderFrames++;


    const now =
        performance.now();


    if(
        now-lastFPS >= 1000
    ){

        fpsText.textContent =
            "VIDEO: " +
            renderFrames +
            " | HAND: " +
            handFrames;


        renderFrames = 0;

        handFrames = 0;

        lastFPS = now;

    }


    requestAnimationFrame(
        render
    );

}


/* =====================================================
   INICIAR
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/*
   Estado inicial.
*/

browserFrame.style.display =
    "none";


</script>

</body>

</html>
