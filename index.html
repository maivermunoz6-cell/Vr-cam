<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Box Esqueleto - Optimizado</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .vr-eye {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #111;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #video {
            display: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Iniciando cámara trasera y modelo...</div>

    <video id="video" autoplay playsinline></video>

    <div class="vr-eye">
        <canvas id="canvasLeft"></canvas>
    </div>
    <div class="vr-eye">
        <canvas id="canvasRight"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasLeft = document.getElementById('canvasLeft');
        const canvasRight = document.getElementById('canvasRight');
        const ctxLeft = canvasLeft.getContext('2d');
        const ctxRight = canvasRight.getContext('2d');
        const loadingElement = document.getElementById('loading');

        let processing = false;

        function onResults(results) {
            if (loadingElement.style.display !== 'none') {
                loadingElement.style.display = 'none';
            }

            if (canvasLeft.width !== videoElement.videoWidth) {
                canvasLeft.width = videoElement.videoWidth;
                canvasLeft.height = videoElement.videoHeight;
                canvasRight.width = videoElement.videoWidth;
                canvasRight.height = videoElement.videoHeight;
            }

            drawEye(ctxLeft, results);
            drawEye(ctxRight, results);
            processing = false; // Liberar para el siguiente frame
        }

        function drawEye(ctx, results) {
            ctx.save();
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.drawImage(results.image, 0, 0, ctx.canvas.width, ctx.canvas.height);
            
            if (results.poseLandmarks) {
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
                    color: '#00FFCC', 
                    lineWidth: 4
                });
                drawLandmarks(ctx, results.poseLandmarks, {
                    color: '#FF0055', 
                    lineWidth: 2, 
                    radius: 4
                });
            }
            ctx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 0,      // 0 = Más ligero y rápido (evita trabarse en móviles)
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // Forzar cámara trasera con restricciones explícitas
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: "environment" }, // Forzar cámara trasera
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                videoElement.srcObject = stream;
                
                // Bucle optimizado para enviar frames sin sobrecargar el hilo
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    requestAnimationFrame(processFrame);
                };
            } catch (err) {
                console.warn("No se pudo usar 'exact environment', intentando con 'environment' genérico...", err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "environment",
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                    videoElement.srcObject = fallbackStream;
                    videoElement.onloadedmetadata = () => {
                        videoElement.play();
                        requestAnimationFrame(processFrame);
                    };
                } catch (err2) {
                    loadingElement.innerText = "Error: No se pudo acceder a la cámara trasera.";
                    console.error(err2);
                }
            }
        }

        async function processFrame() {
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA && !processing) {
                processing = true;
                await pose.send({ image: videoElement });
            }
            requestAnimationFrame(processFrame);
        }

        startCamera();
    </script>
</body>
</html>
