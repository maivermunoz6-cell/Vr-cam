<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>VR Camera 60 FPS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

#app{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
}

#video{
    display:none;
}

#vrCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#000;
}

#divider{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    transform:translateX(-50%);
    background:#000;
    z-index:10;
    pointer-events:none;
}

#startScreen{
    position:absolute;
    inset:0;
    z-index:50;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,
        #102020 0%,
        #020505 45%,
        #000 100%);

    color:white;
    text-align:center;
}

#startScreen h1{
    font-size:clamp(25px,7vw,55px);
    letter-spacing:4px;
    margin-bottom:15px;

    text-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff;
}

#startScreen p{
    width:85%;
    max-width:600px;
    color:#a8ffff;
    margin-bottom:30px;
    line-height:1.5;
}

#startButton{
    padding:18px 35px;

    border:none;
    border-radius:10px;

    background:#001818;
    color:#00ffff;

    border:2px solid #00ffff;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 10px #00ffff,
        inset 0 0 15px #003333;
}

#startButton:active{
    transform:scale(.95);
}

#info{
    position:absolute;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:#00ffff;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(0,255,255,.4);

    border-radius:8px;

    padding:7px 14px;

    font-size:12px;
    letter-spacing:2px;

    pointer-events:none;

    white-space:nowrap;
}

#status{
    position:absolute;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:#00ff88;

    font-size:12px;
    letter-spacing:2px;

    text-shadow:0 0 8px #00ff88;

    pointer-events:none;

    white-space:nowrap;
}
</style>
</head>

<body>

<div id="app">

<video id="video"
       autoplay
       playsinline
       muted></video>

<canvas id="vrCanvas"></canvas>

<div id="divider"></div>

<div id="info">
VR CAMERA • 60 FPS
</div>

<div id="status">
CÁMARA DESACTIVADA
</div>

<div id="startScreen">

<h1>VR VISION</h1>

<p>
Cámara trasera en pantalla dividida para VR Box.
Las manos detectadas aparecerán con un esqueleto
digital.
</p>

<button id="startButton">
ACTIVAR CÁMARA
</button>

</div>

</div>


<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("vrCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha:false,
        desynchronized:true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let cameraStarted = false;

let detectedHands = [];

let lastHandProcess = 0;

let handProcessing = false;


/*
   La cámara se muestra a 60 FPS cuando el
   dispositivo/navegador realmente lo permite.

   La detección de manos se limita a 30 FPS
   para evitar que MediaPipe bloquee el render.
*/

const HAND_FPS = 30;

const HAND_INTERVAL =
    1000 / HAND_FPS;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    canvas.width =
        Math.floor(
            window.innerWidth * dpr
        );

    canvas.height =
        Math.floor(
            window.innerHeight * dpr
        );

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    /*
       Trabajamos directamente en píxeles
       del canvas.
    */

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   CONEXIONES DE LA MANO
===================================================== */

const HAND_CONNECTIONS = [

    /* Pulgar */
    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* Índice */
    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* Medio */
    [5,9],
    [9,10],
    [10,11],
    [11,12],

    /* Anular */
    [9,13],
    [13,14],
    [14,15],
    [15,16],

    /* Meñique */
    [13,17],
    [17,18],
    [18,19],
    [19,20],

    /* Palma */
    [0,17]

];


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile:function(file){

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
            + file;

        }

    });


hands.setOptions({

    /*
       2 manos
    */
    maxNumHands:2,

    /*
       0 = más rápido
       1 = más preciso pero pesado

       Usamos 0 para aumentar FPS.
    */
    modelComplexity:0,

    minDetectionConfidence:0.55,

    minTrackingConfidence:0.55

});


/* =====================================================
   RESULTADOS
===================================================== */

hands.onResults(function(results){

    if(results.multiHandLandmarks){

        detectedHands =
            results.multiHandLandmarks;

    }else{

        detectedHands = [];

    }

});


/* =====================================================
   CÁMARA TRASERA
===================================================== */

async function startCamera(){

    try{

        statusText.textContent =
            "SOLICITANDO CÁMARA TRASERA...";


        /*
        ---------------------------------------------
        PEDIR CÁMARA TRASERA
        ---------------------------------------------
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:60,
                        min:30
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        /*
        ---------------------------------------------
        ESPERAR A QUE LA CÁMARA ESTÉ LISTA
        ---------------------------------------------
        */

        await new Promise(
            resolve => {

                if(video.readyState >= 2){

                    resolve();

                }else{

                    video.onloadedmetadata =
                        resolve;

                }

            }
        );


        await video.play();


        /*
        ---------------------------------------------
        INTENTAR FORZAR 60 FPS
        ---------------------------------------------
        */

        const track =
            stream.getVideoTracks()[0];


        if(track){

            try{

                const capabilities =
                    track.getCapabilities();

                if(
                    capabilities.frameRate &&
                    capabilities.frameRate.max >= 60
                ){

                    await track.applyConstraints({

                        frameRate:{
                            ideal:60,
                            max:60
                        }

                    });

                }

            }catch(e){

                console.log(
                    "No se pudo aplicar 60 FPS:",
                    e
                );

            }

        }


        /*
        ---------------------------------------------
        OCULTAR PANTALLA INICIAL
        ---------------------------------------------
        */

        startScreen.style.display =
            "none";


        cameraStarted = true;


        statusText.textContent =
            "CÁMARA TRASERA ACTIVA • 60 FPS";


        /*
        ---------------------------------------------
        FULLSCREEN
        ---------------------------------------------
        */

        try{

            if(
                document.documentElement
                    .requestFullscreen
            ){

                await
                document.documentElement
                    .requestFullscreen();

            }

        }catch(e){

            console.log(
                "Fullscreen no disponible"
            );

        }


        /*
        ---------------------------------------------
        EMPEZAR DETECCIÓN
        ---------------------------------------------
        */

        requestAnimationFrame(
            render
        );


    }catch(error){

        console.error(error);

        statusText.textContent =
            "ERROR DE CÁMARA";


        alert(
            "No se pudo activar la cámara trasera.\n\n"
            +
            error.message
        );

    }

}


/* =====================================================
   PROCESAMIENTO DE MANOS
===================================================== */

async function processHands(timestamp){

    /*
       No ejecutar MediaPipe continuamente.

       Esto evita que el procesador se sature.
    */

    if(
        !cameraStarted ||
        handProcessing
    ){

        return;

    }


    if(
        timestamp - lastHandProcess <
        HAND_INTERVAL
    ){

        return;

    }


    lastHandProcess =
        timestamp;


    if(
        video.readyState < 2
    ){

        return;

    }


    handProcessing = true;


    try{

        await hands.send({

            image:video

        });

    }catch(error){

        console.log(
            "MediaPipe:",
            error
        );

    }


    handProcessing = false;

}


/* =====================================================
   DIBUJAR CÁMARA
===================================================== */

function drawEye(
    x,
    eyeWidth
){

    if(
        video.readyState < 2
    ){

        return;

    }


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    if(!vw || !vh){

        return;

    }


    const videoRatio =
        vw / vh;

    const screenRatio =
        eyeWidth / canvas.height;


    let dw;
    let dh;


    /*
    ---------------------------------------------
    COVER
    ---------------------------------------------
    */

    if(
        videoRatio >
        screenRatio
    ){

        dh =
            canvas.height;

        dw =
            dh * videoRatio;

    }else{

        dw =
            eyeWidth;

        dh =
            dw / videoRatio;

    }


    const offsetX =
        x +
        (eyeWidth-dw)/2;


    const offsetY =
        (canvas.height-dh)/2;


    /*
    ---------------------------------------------
    CÁMARA TRASERA

    NO hacemos mirror.

    ---------------------------------------------
    */

    ctx.drawImage(

        video,

        offsetX,
        offsetY,
        dw,
        dh

    );

}


/* =====================================================
   DIBUJAR MANOS
===================================================== */

function drawHands(
    x,
    eyeWidth
){

    if(
        detectedHands.length === 0
    ){

        return;

    }


    for(
        const landmarks
        of detectedHands
    ){

        drawHand(
            landmarks,
            x,
            eyeWidth
        );

    }

}


/* =====================================================
   CONVERTIR COORDENADAS
===================================================== */

function getHandPoint(
    point,
    x,
    eyeWidth
){

    /*
       Cámara trasera:

       NO invertimos X.
    */

    const px =
        point.x * eyeWidth + x;


    const py =
        point.y * canvas.height;


    return {

        x:px,
        y:py

    };

}


/* =====================================================
   DIBUJAR ESQUELETO
===================================================== */

function drawHand(
    landmarks,
    x,
    eyeWidth
){

    ctx.save();


    /*
    ---------------------------------------------
    HUESOS
    ---------------------------------------------
    */

    ctx.lineWidth = 3;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.strokeStyle =
        "#00ffff";


    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        "#00ffff";


    for(
        const connection
        of HAND_CONNECTIONS
    ){

        const a =
            getHandPoint(
                landmarks[
                    connection[0]
                ],
                x,
                eyeWidth
            );


        const b =
            getHandPoint(
                landmarks[
                    connection[1]
                ],
                x,
                eyeWidth
            );


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }


    /*
    ---------------------------------------------
    ARTICULACIONES
    ---------------------------------------------
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.shadowBlur =
        15;

    ctx.shadowColor =
        "#00ffff";


    for(
        const point
        of landmarks
    ){

        const p =
            getHandPoint(
                point,
                x,
                eyeWidth
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   RENDER PRINCIPAL
===================================================== */

function render(timestamp){

    /*
       IMPORTANTE:

       requestAnimationFrame intenta actualizar
       la pantalla aproximadamente 60 veces por
       segundo.
    */

    const width =
        canvas.width;

    const height =
        canvas.height;


    /*
    ---------------------------------------------
    LIMPIAR
    ---------------------------------------------
    */

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
    ---------------------------------------------
    DOS OJOS
    ---------------------------------------------
    */

    const half =
        width / 2;


    /*
    OJO IZQUIERDO
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        0,
        0,
        half,
        height
    );

    ctx.clip();


    drawEye(
        0,
        half
    );


    ctx.restore();


    /*
    OJO DERECHO
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        half,
        0,
        half,
        height
    );

    ctx.clip();


    drawEye(
        half,
        half
    );


    ctx.restore();


    /*
    ---------------------------------------------
    HUESOS DIGITALES
    ---------------------------------------------
    */

    drawHands(
        0,
        half
    );


    drawHands(
        half,
        half
    );


    /*
    ---------------------------------------------
    PROCESAMIENTO DE MANOS
    ---------------------------------------------
    */

    processHands(timestamp);


    /*
    ---------------------------------------------
    SIGUIENTE FRAME
    ---------------------------------------------
    */

    requestAnimationFrame(
        render
    );

}


/* =====================================================
   BOTÓN
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
      </html>
