<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>VR Hand Vision 60 FPS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    touch-action:none;

}

#vr{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    display:flex;

    background:#000;

}

.eye{

    position:relative;

    width:50%;
    height:100%;

    overflow:hidden;

    background:#000;

}

.eye video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    background:#000;

}

.handCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

}

#centerLine{

    position:fixed;

    left:50%;
    top:0;

    width:2px;
    height:100%;

    transform:translateX(-50%);

    background:#000;

    z-index:20;

    pointer-events:none;

}

#info{

    position:fixed;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ffff;

    background:rgba(0,0,0,.55);

    border:2px solid rgba(0,255,255,.55);

    border-radius:10px;

    padding:8px 15px;

    font-size:12px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #00ffff;

    white-space:nowrap;

    pointer-events:none;

}

#fps{

    position:fixed;

    top:15px;
    right:12px;

    z-index:50;

    color:#00ff88;

    background:rgba(0,0,0,.5);

    border:1px solid rgba(0,255,136,.4);

    border-radius:6px;

    padding:6px 9px;

    font-size:11px;

    font-family:monospace;

    pointer-events:none;

}

#status{

    position:fixed;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    color:#00ff88;

    font-size:12px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #00ff88;

    white-space:nowrap;

    pointer-events:none;

}

#startScreen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    background:
        radial-gradient(
            circle,
            #082020 0%,
            #020707 45%,
            #000 100%
        );

}

#startScreen h1{

    font-size:clamp(
        28px,
        8vw,
        60px
    );

    letter-spacing:5px;

    margin-bottom:20px;

    color:#00ffff;

    text-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;

}

#startScreen p{

    width:85%;

    max-width:650px;

    color:#baffff;

    line-height:1.6;

    margin-bottom:30px;

}

#startButton{

    padding:18px 35px;

    color:#00ffff;

    background:#001818;

    border:2px solid #00ffff;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    box-shadow:
        0 0 12px #00ffff,
        inset 0 0 15px #003333;

}

#startButton:active{

    transform:scale(.94);

}

</style>

</head>

<body>


<div id="vr">


    <!-- OJO IZQUIERDO -->

    <div class="eye">

        <video
            id="leftVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="leftHands"
            class="handCanvas">
        </canvas>

    </div>


    <!-- OJO DERECHO -->

    <div class="eye">

        <video
            id="rightVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas
            id="rightHands"
            class="handCanvas">
        </canvas>

    </div>

</div>


<div id="centerLine"></div>


<div id="info">
    VR CAMERA • 60 FPS
</div>


<div id="fps">
    VIDEO: -- | HAND: --
</div>


<div id="status">
    CÁMARA DESACTIVADA
</div>


<div id="startScreen">

    <h1>VR VISION</h1>

    <p>
        Cámara trasera para VR Box.
        Detección de manos de alta precisión
        y esqueleto digital fluido.
    </p>

    <button id="startButton">
        ACTIVAR CÁMARA
    </button>

</div>


<!-- MEDIA PIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const leftVideo =
    document.getElementById("leftVideo");

const rightVideo =
    document.getElementById("rightVideo");

const leftCanvas =
    document.getElementById("leftHands");

const rightCanvas =
    document.getElementById("rightHands");

const leftCtx =
    leftCanvas.getContext("2d");

const rightCtx =
    rightCanvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const fpsText =
    document.getElementById("fps");


/* =====================================================
   CONFIGURACIÓN
===================================================== */


/*
   OBJETIVO DEL RENDER

   La interfaz intenta funcionar a 60 FPS.
*/

const RENDER_FPS = 60;


/*
   OBJETIVO DE DETECCIÓN

   Intentamos hasta 50 detecciones por segundo.
*/

const HAND_FPS = 50;

const HAND_INTERVAL =
    1000 / HAND_FPS;


/*
   Interpolación.

   0.30 = más suave
   1.00 = sigue directamente la detección

   Usamos 0.45 para mantener precisión
   sin que los huesos vibren demasiado.
*/

const SMOOTHING = 0.45;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let running = false;

let detectorBusy = false;

let lastDetection = 0;

let detectedHands = [];

let smoothHands = [];

let renderFrames = 0;

let detectionFrames = 0;

let lastFPSUpdate =
    performance.now();

let renderFPS = 0;

let handFPS = 0;


/* =====================================================
   CONEXIONES DE LA MANO
===================================================== */

const connections = [

    /* Pulgar */

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* Índice */

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* Medio */

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    /* Anular */

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    /* Meñique */

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    /* Palma */

    [0,17]

];


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands = new Hands({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    /*
       2 manos
    */

    maxNumHands:2,


    /*
       1 = mayor precisión

       Es más pesado que 0.
    */

    modelComplexity:1,


    /*
       Mayor confianza.
    */

    minDetectionConfidence:0.70,

    minTrackingConfidence:0.70

});


/* =====================================================
   RESULTADOS
===================================================== */

hands.onResults(function(results){

    detectionFrames++;


    if(
        results &&
        results.multiHandLandmarks
    ){

        detectedHands =
            results.multiHandLandmarks;

    }else{

        detectedHands = [];

    }

});


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvases(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    const width =
        Math.floor(
            window.innerWidth / 2 * dpr
        );


    const height =
        Math.floor(
            window.innerHeight * dpr
        );


    leftCanvas.width =
        width;

    leftCanvas.height =
        height;


    rightCanvas.width =
        width;

    rightCanvas.height =
        height;

}


window.addEventListener(
    "resize",
    resizeCanvases
);

resizeCanvases();


/* =====================================================
   CÁMARA
===================================================== */

async function startCamera(){

    try{

        statusText.textContent =
            "ACTIVANDO CÁMARA...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280,
                        min:640
                    },

                    height:{
                        ideal:720,
                        min:480
                    },

                    frameRate:{
                        ideal:60,
                        max:60
                    }

                },

                audio:false

            });


        /*
        ---------------------------------------------
        MISMA CÁMARA PARA LOS DOS OJOS
        ---------------------------------------------
        */

        leftVideo.srcObject =
            stream;

        rightVideo.srcObject =
            stream;


        await leftVideo.play();

        await rightVideo.play();


        /*
        ---------------------------------------------
        INFORMACIÓN REAL DE LA CÁMARA
        ---------------------------------------------
        */

        const track =
            stream.getVideoTracks()[0];


        if(track){

            try{

                const capabilities =
                    track.getCapabilities();


                if(
                    capabilities.frameRate
                ){

                    const maxFPS =
                        capabilities
                            .frameRate.max;


                    /*
                    Intentar 60.
                    */

                    if(maxFPS >= 60){

                        await track.applyConstraints({

                            frameRate:{
                                min:50,
                                ideal:60,
                                max:60
                            }

                        });

                    }else{

                        await track.applyConstraints({

                            frameRate:{
                                ideal:maxFPS,
                                max:maxFPS
                            }

                        });

                    }

                }

            }catch(error){

                console.log(
                    "No se pudo modificar FPS:",
                    error
                );

            }

        }


        running = true;


        startScreen.style.display =
            "none";


        statusText.textContent =
            "BUSCANDO MANOS...";


        /*
        ---------------------------------------------
        FULLSCREEN
        ---------------------------------------------
        */

        try{

            if(
                document.documentElement
                    .requestFullscreen
            ){

                await
                document.documentElement
                    .requestFullscreen();

            }

        }catch(error){}


        /*
        ---------------------------------------------
        INICIAR RENDER
        ---------------------------------------------
        */

        requestAnimationFrame(
            render
        );


    }catch(error){

        console.error(error);


        statusText.textContent =
            "ERROR DE CÁMARA";


        alert(
            "No se pudo iniciar la cámara.\n\n"
            +
            error.message
        );

    }

}


/* =====================================================
   DETECCIÓN DE MANOS
===================================================== */

async function detectHands(time){

    if(!running){

        return;

    }


    /*
       Evitar dos inferencias simultáneas.
    */

    if(detectorBusy){

        return;

    }


    /*
       50 FPS objetivo.
    */

    if(
        time - lastDetection <
        HAND_INTERVAL
    ){

        return;

    }


    /*
       Vídeo listo.
    */

    if(
        leftVideo.readyState < 2
    ){

        return;

    }


    lastDetection =
        time;


    detectorBusy = true;


    try{

        await hands.send({

            image:leftVideo

        });

    }catch(error){

        console.error(
            "MediaPipe:",
            error
        );

    }


    detectorBusy = false;

}


/* =====================================================
   SUAVIZAR MANOS
===================================================== */

function updateSmoothHands(){

    /*
       Si no hay manos detectadas,
       dejamos que desaparezcan.
    */

    if(
        detectedHands.length === 0
    ){

        smoothHands = [];

        return;

    }


    /*
       Si cambió el número de manos,
       comenzar de nuevo.
    */

    if(
        smoothHands.length !==
        detectedHands.length
    ){

        smoothHands =
            detectedHands.map(
                hand =>

                hand.map(
                    p => ({
                        x:p.x,
                        y:p.y,
                        z:p.z
                    })
                )

            );

        return;

    }


    /*
       Interpolación.
    */

    for(
        let h=0;
        h<detectedHands.length;
        h++
    ){

        const target =
            detectedHands[h];

        const current =
            smoothHands[h];


        for(
            let i=0;
            i<target.length;
            i++
        ){

            current[i].x +=
                (
                    target[i].x -
                    current[i].x
                )
                * SMOOTHING;


            current[i].y +=
                (
                    target[i].y -
                    current[i].y
                )
                * SMOOTHING;


            current[i].z +=
                (
                    target[i].z -
                    current[i].z
                )
                * SMOOTHING;

        }

    }

}


/* =====================================================
   DIBUJAR MANO
===================================================== */

function drawHand(
    ctx,
    landmarks,
    width,
    height
){

    ctx.save();


    /*
    ---------------------------------------------
    HUESOS
    ---------------------------------------------
    */

    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        3.2;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.shadowBlur =
        13;

    ctx.shadowColor =
        "#00ffff";


    for(
        const connection
        of connections
    ){

        const a =
            landmarks[
                connection[0]
            ];

        const b =
            landmarks[
                connection[1]
            ];


        const ax =
            a.x * width;

        const ay =
            a.y * height;


        const bx =
            b.x * width;

        const by =
            b.y * height;


        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.lineTo(
            bx,
            by
        );

        ctx.stroke();

    }


    /*
    ---------------------------------------------
    ARTICULACIONES
    ---------------------------------------------
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#00ffff";


    for(
        const p
        of landmarks
    ){

        const x =
            p.x * width;

        const y =
            p.y * height;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   DIBUJAR MANOS
===================================================== */

function drawHands(
    ctx,
    canvas
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for(
        const hand
        of smoothHands
    ){

        drawHand(

            ctx,

            hand,

            canvas.width,

            canvas.height

        );

    }

}


/* =====================================================
   FPS
===================================================== */

function updateFPS(){

    const now =
        performance.now();


    if(
        now - lastFPSUpdate >= 1000
    ){

        renderFPS =
            renderFrames;

        handFPS =
            detectionFrames;


        fpsText.textContent =
            "VIDEO: " +
            renderFPS +
            " | HAND: " +
            handFPS;


        renderFrames = 0;

        detectionFrames = 0;

        lastFPSUpdate = now;


        if(
            smoothHands.length > 0
        ){

            statusText.textContent =
                smoothHands.length === 1
                ? "1 MANO • TRACKING"
                : smoothHands.length +
                  " MANOS • TRACKING";

        }else{

            statusText.textContent =
                "BUSCANDO MANOS...";

        }

    }

}


/* =====================================================
   RENDER PRINCIPAL
===================================================== */

function render(time){

    if(!running){

        return;

    }


    /*
    ---------------------------------------------
    DETECCIÓN
    ---------------------------------------------
    */

    detectHands(time);


    /*
    ---------------------------------------------
    SUAVIZADO
    ---------------------------------------------
    */

    updateSmoothHands();


    /*
    ---------------------------------------------
    DIBUJAR
    ---------------------------------------------
    */

    drawHands(
        leftCtx,
        leftCanvas
    );


    drawHands(
        rightCtx,
        rightCanvas
    );


    /*
    ---------------------------------------------
    FPS
    ---------------------------------------------
    */

    renderFrames++;

    updateFPS();


    /*
    ---------------------------------------------
    SIGUIENTE FRAME
    ---------------------------------------------
    */

    requestAnimationFrame(
        render
    );

}


/* =====================================================
   BOTÓN
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
